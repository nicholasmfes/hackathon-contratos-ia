# =============================================================================
# Hackathon C-ApA-IM | Desafio 4 — Mentor do Fiscal
# banco + servidor MCP (ferramentas) + agente Google ADK (tela web) + Metabase
# Base: docker/docker-compose.yml do SIDEC-MB (mesmas escolhas testadas).
#
# Subir:  docker compose up -d        Parar: docker compose down
# Zerar:  docker compose down -v      (apaga o banco; a carga do kit roda de novo)
# =============================================================================
name: hackathon-contratos

services:

  db:
    image: postgres:18
    container_name: hk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: America/Sao_Paulo
      METABASE_APP_PWD: ${METABASE_APP_PWD:?defina no .env}
      LEITOR_PWD: ${LEITOR_PWD:?defina no .env}
      AGENTE_RO_PWD: ${AGENTE_RO_PWD:?defina no .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./dados/kit:/kit:ro
    ports:
      - "127.0.0.1:${DB_PORTA:-5432}:5432"
    healthcheck:
      # consulta de verdade (lição do SIDEC-MB: pg_isready responde "ok" com o
      # banco ainda vazio). Só passa depois que a carga do kit terminou.
      test: ["CMD-SHELL", "psql -U postgres -d hackathon -Atc 'SELECT 1 FROM controle.carga_concluida' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 90
      start_period: 60s

  metabase:
    image: metabase/metabase:${METABASE_TAG:-v0.62.3.5}
    container_name: hk-metabase
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabaseappdb
      MB_DB_USER: metabase_app
      MB_DB_PASS: ${METABASE_APP_PWD}
      JAVA_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3000:3000"

  # Ferramentas do sistema expostas como servidor MCP (lê o banco só com agente_ro)
  mcp:
    build: ./mcp_server
    container_name: hk-mcp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: hackathon
      PGUSER: agente_ro
      PGPASSWORD: ${AGENTE_RO_PWD}
      URL_ARQUIVOS: http://localhost:8080
      TZ: America/Sao_Paulo
    volumes:
      - ./saida:/app/saida
    ports:
      - "127.0.0.1:8080:8080"

  # Agente do Google ADK (Gemini) com a interface web de chat em http://localhost:8000
  agente:
    build: ./agente_adk
    container_name: hk-agente
    restart: unless-stopped
    depends_on:
      - mcp
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
      MODELO_GEMINI: ${MODELO_GEMINI:-gemini-3.7-flash}
      MCP_URL: http://mcp:8080/mcp
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  db_data:
