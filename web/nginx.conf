# Tela do fiscal (Mentor do Fiscal): arquivos estáticos + proxy para o agente e para o servidor de dados.
# Tudo no mesmo endereço, então o navegador não precisa de CORS e a proteção de origem do ADK continua ativa.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: resolve de novo se o contêiner do agente for recriado (IP novo).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agente http://agente:8000;
    set $mcp http://mcp:8080;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Agente do Google ADK (sessões e /run_sse com streaming)
    location /api/agente/ {
        rewrite ^/api/agente/(.*)$ /$1 break;
        proxy_pass $agente;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # o ADK compara Origin com Host: mesma origem = permitido
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Dados do painel (mesmas funções das ferramentas MCP, sem IA)
    location /api/dados/ {
        rewrite ^/api/dados/(.*)$ /api/$1 break;
        proxy_pass $mcp;
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
    }

    # Relatórios (.docx) e agendas (.ics) gerados
    location /arquivos/ {
        proxy_pass $mcp;
        proxy_set_header Host $http_host;
    }
}
